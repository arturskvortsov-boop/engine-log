<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EngineLog - Chief Engineer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<style>
    :root {
        --bg: #0f172a; --card: #1e293b; --border: #334155;
        --text: #e2e8f0; --text-muted: #94a3b8;
        --accent: #38bdf8; --accent-dark: #0284c7;
        --yellow: #fbbf24; --red: #f87171; --green: #4ade80;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .header p { font-size: 0.7rem; color: var(--text-muted); }

    .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 8px 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #000; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 0.95rem; color: var(--yellow); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 0.9rem; }
    .form-group textarea { resize: vertical; min-height: 60px; font-family: monospace; }
    
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; }
    .btn:active { background: var(--accent-dark); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; }

    .result-box { background: #020617; border: 1px solid var(--accent); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 12px; white-space: pre-wrap; color: var(--text); display: none; line-height: 1.6; }
    .copy-btn { background: var(--border); color: var(--text); margin-top: 8px; display: none; }
    
    .tank-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tank-list-item:last-child { border-bottom: none; }

    /* МОБИЛЬНЫЙ ФИКС */
    @media (max-width: 600px) {
        .row-2 { grid-template-columns: 1fr !important; gap: 10px !important; }
    }
    input, select, textarea { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; min-width: 0 !important; -webkit-appearance: none; appearance: none; }
    input[type="date"], input[type="time"] { min-height: 42px; line-height: normal; }
</style>
</head>
<body>

<div class="header">
    <h1>EngineLog</h1>
    <p>MARPOL & Changeover Assistant</p>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="chg">⛽ Changeover</button>
    <button class="tab-btn" data-tab="orb">📘 ORB Gen</button>
    <button class="tab-btn" data-tab="tanks">⚙️ Tanks</button>
</div>

<!-- TAB 1: CHANGEOVER -->
<div id="tab-chg" class="tab-content">
    <div class="card">
        <h2>Fuel Changeover Record</h2>
        <div class="row-2">
            <div class="form-group"><label>Date</label><input type="date" id="chgDate"></div>
            <div class="form-group"><label>Position (Lat/Long)</label><input type="text" id="chgPos" placeholder="Lat / Long"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Type</label><select id="chgType"><option value="HFO/VLSFO to MGO/MDO">HFO/VLSFO to MGO/MDO</option><option value="MGO/MDO to HFO/VLSFO">MGO/MDO to HFO/VLSFO</option></select></div>
            <div class="form-group"><label>Sulfur Target (%)</label><input type="number" id="chgSulfur" step="0.01" value="0.10"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Start Time</label><input type="time" id="chgStart"></div>
            <div class="form-group"><label>Finish Time</label><input type="time" id="chgFinish"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Start Viscosity (cSt)</label><input type="number" id="chgViscStart" placeholder="380"></div>
            <div class="form-group"><label>Finish Viscosity (cSt)</label><input type="number" id="chgViscEnd" placeholder="12"></div>
        </div>
        <button class="btn" id="btnGenChg">Generate Text</button>
        <div class="result-box" id="resChg"></div>
        <button class="btn copy-btn" id="btnCopyChg">📋 Copy Text</button>
    </div>
</div>

<!-- TAB 2: ORB GENERATOR -->
<div id="tab-orb" class="tab-content" style="display:none;">
    <div class="card">
        <h2>ORB Entry Generator</h2>
        
        <div class="form-group">
            <label>Select Operation Code</label>
            <select id="orbCodeSelect">
                <option value="C11.1">C 11.1 - Weekly Inventory of Sludge Tanks</option>
                <option value="C11.4">C 11.4 - Collection of Sludge (from source)</option>
                <option value="C12.1">C 12.1 - Disposal of Sludge to Shore</option>
                <option value="C12.2">C 12.2 - Transfer Sludge to another tank</option>
                <option value="C12.3">C 12.3 - Incineration of Sludge</option>
                <option value="C12.4">C 12.4 - Evaporation of water from sludge tank</option>
                <option value="D15.1">D 13-15.1 - Discharge Bilge Overboard (15 ppm)</option>
                <option value="D15.2">D 13-15.2 - Disposal Bilge to Shore</option>
                <option value="D15.3">D 13-15.3 - Transfer Bilge to another tank</option>
                <option value="F19">F 19-21 - Failure of 15 ppm Equipment</option>
                <option value="I_ALARM">I - Testing 15 ppm Alarm (Remarks)</option>
                <option value="I_BILGE">I - Weekly Inventory of Bilge Water</option>
                <option value="I_VALVE">I - Sealing / Unsealing of Overboard Valve</option>
                <option value="G">G - Accidental Discharge</option>
            </select>
        </div>

        <div id="orbDynamicFields"></div>

        <button class="btn" id="btnGenOrb">Generate ORB Entry</button>
        <div class="result-box" id="resOrb"></div>
        <button class="btn copy-btn" id="btnCopyOrb">📋 Copy Text</button>
    </div>
</div>

<!-- TAB 3: TANKS SETUP -->
<div id="tab-tanks" class="tab-content" style="display:none;">
    <div class="card">
        <h2>Vessel Tanks Setup</h2>
        
        <div class="form-group">
            <label>Tank Name (as per IOPPC)</label>
            <input type="text" id="newTankName" placeholder="e.g. SLUDGE TANK">
        </div>
        <div class="form-group">
            <label>Location / Frame No. (Optional)</label>
            <input type="text" id="newTankLoc" placeholder="e.g. FR NO. 21-28 PORT">
        </div>
        <div class="form-group">
            <label>Tank Category</label>
            <select id="newTankType">
                <option value="sludge">Oil Residue / Sludge (Sec 3.1)</option>
                <option value="bilge">Bilge Holding (Sec 3.3)</option>
            </select>
        </div>
        <button class="btn" id="btnAddTank">+ Add Tank</button>

        <div id="tankList" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    // === TABS LOGIC ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
        };
    });

    // === DATE FORMATTER (dd-MMM-yyyy) ===
    function formatDate(dateStr) {
        if(!dateStr) return '';
        const d = new Date(dateStr);
        const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const day = String(d.getDate()).padStart(2, '0');
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
    }

    // === COPY FUNCTION ===
    function setupCopy(btnId, boxId) {
        document.getElementById(btnId).onclick = function() {
            const text = document.getElementById(boxId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                this.textContent = '✅ Copied!';
                setTimeout(() => { this.textContent = '📋 Copy Text'; }, 2000);
            });
        };
    }
    setupCopy('btnCopyChg', 'resChg');
    setupCopy('btnCopyOrb', 'resOrb');

    // === TANKS MANAGEMENT ===
    let tanks = JSON.parse(localStorage.getItem('vessel_tanks')) || [
        {id: 't1', name: 'INCI W.O. SERV TANK', loc: 'FR NO. 17-19 PORT', type: 'sludge'},
        {id: 't2', name: 'INCI W.O. SETTL TANK', loc: 'FR NO. 17-19 PORT', type: 'sludge'},
        {id: 't3', name: 'SLUDGE TANK', loc: 'FR NO. 21-28 PORT', type: 'sludge'},
        {id: 't4', name: 'M.E. SCAV AIR BOX DRAIN TANK', loc: 'FR NO. 25-26 PORT', type: 'sludge'},
        {id: 't5', name: 'OILY BILGE TANK', loc: 'FR NO. 26-30 PORT', type: 'bilge'},
        {id: 't6', name: 'BILGE HOLDING TANK', loc: 'FR NO. 13-19 CENTER', type: 'bilge'}
    ];
    localStorage.setItem('vessel_tanks', JSON.stringify(tanks)); // Save defaults if empty

    function renderTankList() {
        const list = document.getElementById('tankList');
        if (!list) return;
        
        if (tanks.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:10px;">No tanks added yet.</div>';
            return;
        }
        
        list.innerHTML = tanks.map(t => `
            <div class="tank-list-item">
                <div>
                    <div style="font-weight:600; font-size:0.9rem;">${t.name}</div>
                    <div style="font-size:0.7rem; color:var(--text-muted);">${t.loc || ''} (${t.type === 'sludge' ? 'Sludge 3.1' : 'Bilge 3.3'})</div>
                </div>
                <button class="btn-danger" onclick="deleteTank('${t.id}')">Del</button>
            </div>
        `).join('');
    }

    window.deleteTank = function(id) {
        if(!confirm('Delete this tank?')) return;
        tanks = tanks.filter(t => t.id !== id);
        localStorage.setItem('vessel_tanks', JSON.stringify(tanks));
        renderTankList();
        renderOrbFields(); 
    };

    document.getElementById('btnAddTank').onclick = () => {
        const name = document.getElementById('newTankName').value.trim();
        const loc = document.getElementById('newTankLoc').value.trim();
        const type = document.getElementById('newTankType').value;
        if (!name) { alert('Enter tank name'); return; }
        
        tanks.push({ id: 't_' + Date.now(), name: name, loc: loc, type: type });
        localStorage.setItem('vessel_tanks', JSON.stringify(tanks));
        document.getElementById('newTankName').value = '';
        document.getElementById('newTankLoc').value = '';
        renderTankList();
        renderOrbFields();
    };

    // === CHANGEOVER GENERATOR ===
    document.getElementById('chgDate').valueAsDate = new Date();
    document.getElementById('btnGenChg').onclick = () => {
        const date = formatDate(document.getElementById('chgDate').value);
        const pos = document.getElementById('chgPos').value || 'N/A';
        const type = document.getElementById('chgType').value;
        const sulfur = document.getElementById('chgSulfur').value;
        const start = document.getElementById('chgStart').value;
        const finish = document.getElementById('chgFinish').value;
        const vStart = document.getElementById('chgViscStart').value || 'N/A';
        const vEnd = document.getElementById('chgViscEnd').value || 'N/A';

        if(!start || !finish) { alert('Enter Start and Finish times.'); return; }

        let text = `${date} at Position: ${pos}\n`;
        text += `Commenced fuel oil changeover from ${type.split(' to ')[0]} to ${type.split(' to ')[1]}.\n`;
        text += `Start Time: ${start}. Initial Viscosity: ${vStart} cSt.\n`;
        text += `Completed fuel oil changeover at ${finish}.\n`;
        text += `Final Viscosity: ${vEnd} cSt. Sulfur content: max ${sulfur}% m/m.\n`;
        text += `Changeover procedure performed in accordance with vessel's approved changeover plan.`;

        document.getElementById('resChg').innerText = text;
        document.getElementById('resChg').style.display = 'block';
        document.getElementById('btnCopyChg').style.display = 'block';
    };

    // === ORB DYNAMIC FIELDS ===
    const orbFields = {
        'C11.1': `
            <div class="form-group"><label>Tank (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Capacity (m³)</label><input type="number" id="orbCap" step="0.01"></div>
                <div class="form-group"><label>Quantity Retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
        `,
        'C11.4': `
            <div class="form-group"><label>Destination Tank (Sludge)</label><select id="orbDestTank" class="tank-select-sludge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity collected (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Source of Sludge</label><input type="text" id="orbSource" placeholder="e.g. M/E Sump Tank"></div>
        `,
        'C12.1': `
            <div class="form-group"><label>Source Tank (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Receiver (Barge/Truck)</label><input type="text" id="orbReceiver" placeholder="e.g. Barge 'Eco-Service'"></div>
            <div class="form-group"><label>Port Name</label><input type="text" id="orbPort" placeholder="e.g. Fujairah"></div>
        `,
        'C12.2': `
            <div class="form-group"><label>Source Tank (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="form-group"><label>Destination Tank</label><select id="orbDestTank" class="tank-select-all"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity transferred (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Retained in source (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Retained in destination (m³)</label><input type="number" id="orbRetainedDest" step="0.01"></div>
        `,
        'C12.3': `
            <div class="form-group"><label>Source Tank (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity incinerated (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Duration (hours)</label><input type="number" id="orbHours" step="0.1"></div>
        `,
        'C12.4': `
            <div class="form-group"><label>Source Tank (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Water Evaporated (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
        `,
        'D15.1': `
            <div class="form-group"><label>Source Tank (Bilge)</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Capacity of tank (m³)</label><input type="number" id="orbCap" step="0.01"></div>
            </div>
            <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            <div class="row-2">
                <div class="form-group"><label>Start (GMT)</label><input type="time" id="orbStartGmt"></div>
                <div class="form-group"><label>Start (LT)</label><input type="time" id="orbStartLt"></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Stop (GMT)</label><input type="time" id="orbStopGmt"></div>
                <div class="form-group"><label>Stop (LT)</label><input type="time" id="orbStopLt"></div>
            </div>
            <div class="form-group"><label>Position Start</label><input type="text" id="orbPosStart" placeholder="LAT XXX LONG XXX"></div>
            <div class="form-group"><label>Position Stop</label><input type="text" id="orbPosStop" placeholder="LAT XXX LONG XXX"></div>
        `,
        'D15.2': `
            <div class="form-group"><label>Source Tank (Bilge)</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Port / Reception</label><input type="text" id="orbPort" placeholder="e.g. Rotterdam"></div>
            <div class="form-group"><label>Receipt No.</label><input type="text" id="orbReceipt" placeholder="e.g. 453"></div>
        `,
        'D15.3': `
            <div class="form-group"><label>Source Tank (Bilge)</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
            <div class="form-group"><label>Destination Tank</label><select id="orbDestTank" class="tank-select-all"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Retained in source (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Retained in destination (m³)</label><input type="number" id="orbRetainedDest" step="0.01"></div>
        `,
        'F19': `
            <div class="row-2">
                <div class="form-group"><label>Time of Failure (GMT)</label><input type="time" id="orbStartGmt"></div>
                <div class="form-group"><label>Time of Failure (LT)</label><input type="time" id="orbStartLt"></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Time Restored (GMT)</label><input type="time" id="orbStopGmt"></div>
                <div class="form-group"><label>Time Restored (LT)</label><input type="time" id="orbStopLt"></div>
            </div>
            <div class="form-group"><label>Reason for Failure</label><input type="text" id="orbSource" placeholder="e.g. FAILURE OF FILTER ELEMENT"></div>
        `,
        'I_ALARM': `
            <div class="row-2">
                <div class="form-group"><label>Start (GMT)</label><input type="time" id="orbStartGmt"></div>
                <div class="form-group"><label>Start (LT)</label><input type="time" id="orbStartLt"></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Stop (GMT)</label><input type="time" id="orbStopGmt"></div>
                <div class="form-group"><label>Stop (LT)</label><input type="time" id="orbStopLt"></div>
            </div>
        `,
        'I_BILGE': `
            <div class="form-group"><label>Bilge Holding Tank</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Capacity (m³)</label><input type="number" id="orbCap" step="0.01"></div>
                <div class="form-group"><label>Retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
        `,
        'I_VALVE': `
            <div class="form-group"><label>Action</label><select id="orbAction"><option value="UNSEALED">UNSEALED</option><option value="SEALED">SEALED</option></select></div>
            <div class="form-group"><label>Valve No.</label><input type="text" id="orbSource" placeholder="e.g. B059V"></div>
            <div class="form-group"><label>Seal No.</label><input type="text" id="orbReceipt" placeholder="e.g. 979904"></div>
        `,
        'G': `
            <div class="row-2">
                <div class="form-group"><label>Time (GMT)</label><input type="time" id="orbStartGmt"></div>
                <div class="form-group"><label>Time (LT)</label><input type="time" id="orbStartLt"></div>
            </div>
            <div class="form-group"><label>Place or Position</label><input type="text" id="orbPosStart" placeholder="LAT XXX LONG XXX"></div>
            <div class="form-group"><label>Type and Quantity</label><input type="text" id="orbSource" placeholder="e.g. 0.1 m³ HFO"></div>
            <div class="form-group"><label>Circumstances</label><textarea id="orbText" placeholder="e.g. Fuel tank overflow during bunkering"></textarea></div>
        `
    };

    const codeSelect = document.getElementById('orbCodeSelect');
    const dynamicContainer = document.getElementById('orbDynamicFields');

    function getFullTankName(id) {
        const sel = document.getElementById(id);
        if(!sel) return '';
        return sel.options[sel.selectedIndex].text;
    }

    function populateTankSelects() {
        const sludgeTanks = tanks.filter(t => t.type === 'sludge');
        const bilgeTanks = tanks.filter(t => t.type === 'bilge');
        
        function fillSelect(selector, list, defaultName) {
            document.querySelectorAll(selector).forEach(sel => {
                if(list.length === 0) sel.innerHTML = `<option value="${defaultName}">${defaultName}</option>`;
                else sel.innerHTML = list.map(t => `<option value="${t.name} ${t.loc ? t.loc : ''}">${t.name} ${t.loc ? t.loc : ''}</option>`).join('');
            });
        }

        fillSelect('.tank-select-sludge', sludgeTanks, 'SLUDGE TANK');
        fillSelect('.tank-select-bilge', bilgeTanks, 'OILY BILGE TANK');
        
        // Для всех танков (например, при переводе шлама в льяльные воды)
        document.querySelectorAll('.tank-select-all').forEach(sel => {
            sel.innerHTML = tanks.map(t => `<option value="${t.name} ${t.loc ? t.loc : ''}">${t.name} ${t.loc ? t.loc : ''}</option>`).join('');
        });
    }

    function renderOrbFields() {
        dynamicContainer.innerHTML = orbFields[codeSelect.value];
        populateTankSelects();
    }
    codeSelect.onchange = renderOrbFields;

    // === ORB GENERATOR LOGIC ===
    document.getElementById('btnGenOrb').onclick = () => {
        const dateStr = formatDate(document.getElementById('chgDate').value);
        const code = codeSelect.value;
        let text = `Date: ${dateStr}\n`;
        
        const val = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
        const tank = (id) => getFullTankName(id);

        if(code === 'C11.1') {
            text += `C 11.1: ${tank('orbSourceTank')}\n11.2: ${val('orbCap')} m³\n11.3: ${val('orbRetained')} m³`;
        } 
        else if(code === 'C11.4') {
            text += `C 11.4: ${val('orbQty')} m³ collected from ${val('orbSource')}\nRetained in ${tank('orbDestTank')}: ${val('orbRetained')} m³`;
        }
        else if(code === 'C12.1') {
            text += `C 12.1: ${val('orbQty')} m³ sludge from ${tank('orbSourceTank')}, ${val('orbRetained')} m³ retained.\nTransferred to ${val('orbReceiver')} during port stay (${val('orbPort')})`;
        }
        else if(code === 'C12.2') {
            text += `C 12.2: ${val('orbQty')} m³ sludge transferred from ${tank('orbSourceTank')}, ${val('orbRetained')} m³ retained,\nto ${tank('orbDestTank')}, ${val('orbRetainedDest')} m³ retained`;
        }
        else if(code === 'C12.3') {
            text += `C 12.3: ${val('orbQty')} m³ sludge from ${tank('orbSourceTank')}, ${val('orbRetained')} m³ retained,\nBurned in Incinerator for ${val('orbHours')} hours`;
        }
        else if(code === 'C12.4') {
            text += `C 12.4: ${val('orbQty')} m³ water evaporated from ${tank('orbSourceTank')}, ${val('orbRetained')} m³ retained.`;
        }
        else if(code === 'D15.1') {
            text += `D 13: ${val('orbQty')} m³ bilge water from ${tank('orbSourceTank')}\nCapacity ${val('orbCap')} m³, ${val('orbRetained')} m³ retained\n`;
            text += `14 START: ${val('orbStartGmt')}H GMT / ${val('orbStartLt')}H LT\nSTOP: ${val('orbStopGmt')}H GMT / ${val('orbStopLt')}H LT\n`;
            text += `15.1 THROUGH 15 PPM EQUIPMENT OVERBOARD\nPOSITION START: ${val('orbPosStart')}\nPOSITION STOP: ${val('orbPosStop')}`;
        }
        else if(code === 'D15.2') {
            text += `D 13: ${val('orbQty')} m³ bilge water from ${tank('orbSourceTank')}, ${val('orbRetained')} m³ retained\n`;
            text += `15.2 TO PORT RECEPTION FACILITIES OF ${val('orbPort')}, RECEIPT NO: ${val('orbReceipt')}`;
        }
        else if(code === 'D15.3') {
            text += `D 13: ${val('orbQty')} m³ bilge water from ${tank('orbSourceTank')}, ${val('orbRetained')} m³ retained\n`;
            text += `15.3 TO ${tank('orbDestTank')}, ${val('orbRetainedDest')} m³ retained in tank`;
        }
        else if(code === 'F19') {
            text += `F 19: ${val('orbStartGmt')}H GMT / ${val('orbStartLt')}H LT\n20: ${val('orbStopGmt')}H GMT / ${val('orbStopLt')}H LT\n21: ${val('orbSource')}`;
        }
        else if(code === 'I_ALARM') {
            text += `I: TESTED 15 PPM ALARM IN OCM UNIT\nSTART: ${val('orbStartGmt')}H GMT / ${val('orbStartLt')}H LT\nSTOP: ${val('orbStopGmt')}H GMT / ${val('orbStopLt')}H LT\nFOUND WORKING PROPERLY`;
        }
        else if(code === 'I_BILGE') {
            text += `I: WEEKLY INVENTORY OF BILGE HOLDING TANK ${tank('orbSourceTank')}\nCAPACITY ${val('orbCap')} m³; ${val('orbRetained')} m³ RETAINED`;
        }
        else if(code === 'I_VALVE') {
            var action = val('orbAction');
            if(action === 'UNSEALED') {
                text += `I: OVERBOARD VALVE ${val('orbSource')} FROM 15 PPM BILGE WATER SEPARATOR UNIT UNSEALED, SEAL NO. ${val('orbReceipt')}`;
            } else {
                text += `I: OVERBOARD VALVE ${val('orbSource')} FROM 15 PPM BILGE WATER SEPARATOR SEALED, SEAL NO. ${val('orbReceipt')}`;
            }
        }
        else if(code === 'G') {
            text += `G 22: ${val('orbStartGmt')}H GMT / ${val('orbStartLt')}H LT\n23: PLACE OR POSITION: ${val('orbPosStart')}\n24: TYPE AND QUANTITY: ${val('orbSource')}\n25: CIRCUMSTANCES: ${val('orbText')}`;
        }

        // Добавляем подпись
        text += `\nSigned: (Officer-in-charge, Name & Rank) ${dateStr}`;

        document.getElementById('resOrb').innerText = text;
        document.getElementById('resOrb').style.display = 'block';
        document.getElementById('btnCopyOrb').style.display = 'block';
    };

    // === INIT ===
    renderTankList();
    renderOrbFields();

</script>
</body>
</html>
