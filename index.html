<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EngineLog - Chief Engineer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<style>
    :root {
        --bg: #0f172a; --card: #1e293b; --border: #334155;
        --text: #e2e8f0; --text-muted: #94a3b8;
        --accent: #38bdf8; --accent-dark: #0284c7;
        --yellow: #fbbf24; --red: #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .header p { font-size: 0.7rem; color: var(--text-muted); }

    .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 8px 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #000; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 0.95rem; color: var(--yellow); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 0.9rem; }
    .form-group textarea { resize: vertical; min-height: 80px; font-family: monospace; }
    
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; }
    .btn:active { background: var(--accent-dark); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
    .btn-danger:active { opacity: 0.8; }

    .result-box { background: #020617; border: 1px solid var(--accent); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 12px; white-space: pre-wrap; color: var(--text); display: none; line-height: 1.5; }
    .result-ru { background: #1a1500; border: 1px solid var(--yellow); color: var(--yellow); }
    
    .copy-btn { background: var(--border); color: var(--text); margin-top: 8px; display: none; }
    
    .tank-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tank-list-item:last-child { border-bottom: none; }

    /* МОБИЛЬНЫЙ ФИКС */
    @media (max-width: 600px) {
        .row-2 { grid-template-columns: 1fr !important; gap: 10px !important; }
    }
    input, select, textarea { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; min-width: 0 !important; -webkit-appearance: none; appearance: none; }
    input[type="date"], input[type="time"] { min-height: 42px; line-height: normal; }
</style>
</head>
<body>

<div class="header">
    <h1>EngineLog</h1>
    <p>MARPOL & Changeover Assistant</p>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="chg">⛽ Changeover</button>
    <button class="tab-btn" data-tab="orb">📘 ORB Gen</button>
    <button class="tab-btn" data-tab="tanks">⚙️ Tanks</button>
</div>

<!-- TAB 1: CHANGEOVER -->
<div id="tab-chg" class="tab-content">
    <div class="card">
        <h2>Fuel Changeover Record</h2>
        <div class="row-2">
            <div class="form-group"><label>Date</label><input type="date" id="chgDate"></div>
            <div class="form-group"><label>Position (Lat/Long)</label><input type="text" id="chgPos" placeholder="Lat / Long"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Type</label><select id="chgType"><option value="HFO/VLSFO to MGO/MDO">HFO/VLSFO to MGO/MDO</option><option value="MGO/MDO to HFO/VLSFO">MGO/MDO to HFO/VLSFO</option></select></div>
            <div class="form-group"><label>Sulfur Target (%)</label><input type="number" id="chgSulfur" step="0.01" value="0.10"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Start Time</label><input type="time" id="chgStart"></div>
            <div class="form-group"><label>Finish Time</label><input type="time" id="chgFinish"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Start Viscosity (cSt)</label><input type="number" id="chgViscStart" placeholder="380"></div>
            <div class="form-group"><label>Finish Viscosity (cSt)</label><input type="number" id="chgViscEnd" placeholder="12"></div>
        </div>
        <button class="btn" id="btnGenChg">Generate Text</button>
        <div class="result-box" id="resChg"></div>
        <div class="result-box result-ru" id="resChgRu"></div>
        <button class="btn copy-btn" id="btnCopyChg">📋 Copy English Text</button>
    </div>
</div>

<!-- TAB 2: ORB GENERATOR -->
<div id="tab-orb" class="tab-content" style="display:none;">
    <div class="card">
        <h2>ORB Entry Generator</h2>
        
        <div class="form-group">
            <label>Выберите операцию (MARPOL Code)</label>
            <select id="orbCodeSelect">
                <!-- Code C -->
                <option value="C11.4">C 11.4 - Collection of Sludge (Сбор шлама из источника)</option>
                <option value="C12.1">C 12.1 - Disposal of Sludge to Shore (Сдача шлама на берег/баржу)</option>
                <option value="C12.2">C 12.2 - Transfer Sludge to another tank (Перекачка шлама в другой танк)</option>
                <option value="C12.3">C 12.3 - Incineration of Sludge (Сжигание шлама в инсинераторе)</option>
                
                <!-- Code D -->
                <option value="D15.1">D 15.1 - Discharge Bilge Water Overboard (Сброс льяльных вод за борт 15ppm)</option>
                <option value="D15.2">D 15.2 - Transfer Bilge Water to tank (Перекачка льяльных вод в танк)</option>
                
                <!-- Code E -->
                <option value="E16">E 16 - Automatic Discharge Overboard (Автоматический сброс льяльных вод)</option>
                
                <!-- Code F -->
                <option value="F19">F 19-21 - Failure of OWS/OCM (Отказ сепаратора/прибора 15ppm)</option>
                
                <!-- Code G -->
                <option value="G22">G 22-25 - Accidental Discharge (Аварийный сброс нефти)</option>
                
                <!-- Code H -->
                <option value="H26.3">H 26.3 - Bunkering of Fuel Oil (Бункеровка топлива)</option>
                
                <!-- Code I -->
                <option value="I_Scrubber">I - Scrubber Bleed-off / Operations (Работа скраббера / Прочее)</option>
            </select>
        </div>

        <div id="orbDynamicFields"></div>

        <button class="btn" id="btnGenOrb">Generate ORB Entry</button>
        <div class="result-box" id="resOrb"></div>
        <div class="result-box result-ru" id="resOrbRu"></div>
        <button class="btn copy-btn" id="btnCopyOrb">📋 Copy English Text</button>
    </div>
</div>

<!-- TAB 3: TANKS SETUP -->
<div id="tab-tanks" class="tab-content" style="display:none;">
    <div class="card">
        <h2>Vessel Tanks Setup</h2>
        
        <div class="form-group">
            <label>Tank Name (as per IOPPC)</label>
            <input type="text" id="newTankName" placeholder="e.g. SLUDGE TANK (P)">
        </div>
        <div class="form-group">
            <label>Tank Category</label>
            <select id="newTankType">
                <option value="sludge">Oil Residue / Sludge (Sec 3.1)</option>
                <option value="bilge">Bilge Holding (Sec 3.3)</option>
            </select>
        </div>
        <button class="btn" id="btnAddTank">+ Add Tank</button>

        <div id="tankList" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    // === TABS LOGIC ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
        };
    });

    // === DATE FORMATTER (dd-MMM-yyyy) ===
    function formatDate(dateStr) {
        if(!dateStr) return '';
        const d = new Date(dateStr);
        const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const day = String(d.getDate()).padStart(2, '0');
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
    }

    // === COPY FUNCTION ===
    function setupCopy(btnId, boxId) {
        document.getElementById(btnId).onclick = function() {
            const text = document.getElementById(boxId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                this.textContent = '✅ Copied!';
                setTimeout(() => { this.textContent = '📋 Copy English Text'; }, 2000);
            });
        };
    }
    setupCopy('btnCopyChg', 'resChg');
    setupCopy('btnCopyOrb', 'resOrb');

    // === TANKS MANAGEMENT ===
    let tanks = JSON.parse(localStorage.getItem('vessel_tanks')) || [];

    function renderTankList() {
        const list = document.getElementById('tankList');
        if (!list) return;
        
        if (tanks.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:10px;">No tanks added yet. Add your first tank above.</div>';
            return;
        }
        
        list.innerHTML = tanks.map(t => `
            <div class="tank-list-item">
                <div>
                    <div style="font-weight:600; font-size:0.9rem;">${t.name}</div>
                    <div style="font-size:0.7rem; color:var(--text-muted);">${t.type === 'sludge' ? 'Oil Residue (3.1)' : 'Bilge (3.3)'}</div>
                </div>
                <button class="btn-danger" onclick="deleteTank('${t.id}')">Delete</button>
            </div>
        `).join('');
    }

    window.deleteTank = function(id) {
        if(!confirm('Delete this tank?')) return;
        tanks = tanks.filter(t => t.id !== id);
        localStorage.setItem('vessel_tanks', JSON.stringify(tanks));
        renderTankList();
        populateTankSelects();
    };

    document.getElementById('btnAddTank').onclick = () => {
        const name = document.getElementById('newTankName').value.trim();
        const type = document.getElementById('newTankType').value;
        if (!name) { alert('Enter tank name'); return; }
        
        tanks.push({ id: 't_' + Date.now(), name: name, type: type });
        localStorage.setItem('vessel_tanks', JSON.stringify(tanks));
        document.getElementById('newTankName').value = '';
        renderTankList();
        populateTankSelects();
    };

    // === CHANGEOVER GENERATOR ===
    document.getElementById('chgDate').valueAsDate = new Date();
    document.getElementById('btnGenChg').onclick = () => {
        const date = formatDate(document.getElementById('chgDate').value);
        const pos = document.getElementById('chgPos').value || 'N/A';
        const type = document.getElementById('chgType').value;
        const sulfur = document.getElementById('chgSulfur').value;
        const start = document.getElementById('chgStart').value;
        const finish = document.getElementById('chgFinish').value;
        const vStart = document.getElementById('chgViscStart').value || 'N/A';
        const vEnd = document.getElementById('chgViscEnd').value || 'N/A';

        if(!start || !finish) { alert('Enter Start and Finish times.'); return; }

        // ENGLISH
        let text = `${date} at Position: ${pos}\n`;
        text += `Commenced fuel oil changeover from ${type.split(' to ')[0]} to ${type.split(' to ')[1]}.\n`;
        text += `Start Time: ${start}. Initial Viscosity: ${vStart} cSt.\n`;
        text += `Completed fuel oil changeover at ${finish}.\n`;
        text += `Final Viscosity: ${vEnd} cSt. Sulfur content: max ${sulfur}% m/m.\n`;
        text += `Changeover procedure performed in accordance with vessel's approved changeover plan.`;

        // RUSSIAN
        let textRu = `Дата: ${date}, Координаты: ${pos}\n`;
        textRu += `Начат переход топлива с ${type.split(' to ')[0]} на ${type.split(' to ')[1]}.\n`;
        textRu += `Время начала: ${start}. Вязкость: ${vStart} сСт.\n`;
        textRu += `Переход завершен в ${finish}.\n`;
        textRu += `Конечная вязкость: ${vEnd} сСт. Сера: не более ${sulfur}%.\n`;
        textRu += `Процедура выполнена в соответствии с одобренным планом перехода.`;

        document.getElementById('resChg').innerText = text;
        document.getElementById('resChg').style.display = 'block';
        document.getElementById('resChgRu').innerText = textRu;
        document.getElementById('resChgRu').style.display = 'block';
        document.getElementById('btnCopyChg').style.display = 'block';
    };

    // === ORB DYNAMIC FIELDS ===
    const orbFields = {
        'C11.4': `
            <div class="row-2">
                <div class="form-group"><label>Собрано (м³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Осталось в танке (м³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Танк (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
        `,
        'C12.1': `
            <div class="row-2">
                <div class="form-group"><label>Количество (м³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Остаток (м³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Танк (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="form-group"><label>Приемщик (Баржа/Танкер)</label><input type="text" id="orbReceiver" placeholder="e.g. Barge 'Eco-Service'"></div>
            <div class="form-group"><label>Порт</label><input type="text" id="orbPort" placeholder="e.g. Singapore"></div>
        `,
        'C12.2': `
            <div class="row-2">
                <div class="form-group"><label>Перекачано (м³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Остаток в источнике (м³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Откуда (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="form-group"><label>Куда (Sludge)</label><select id="orbDestTank" class="tank-select-sludge"></select></div>
        `,
        'C12.3': `
            <div class="row-2">
                <div class="form-group"><label>Сожжено (м³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Остаток (м³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Танк (Sludge)</label><select id="orbSourceTank" class="tank-select-sludge"></select></div>
            <div class="form-group"><label>Время горения (часы)</label><input type="number" id="orbHours" step="0.1"></div>
        `,
        'D15.1': `
            <div class="row-2">
                <div class="form-group"><label>Сброшено (м³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Вместимость танка (м³)</label><input type="number" id="orbCap" step="0.01"></div>
            </div>
            <div class="form-group"><label>Танк (Bilge)</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
            <div class="row-2">
                <div class="form-group"><label>Время начала</label><input type="time" id="orbStart"></div>
                <div class="form-group"><label>Время окончания</label><input type="time" id="orbStop"></div>
            </div>
            <div class="form-group"><label>Координаты начала</label><input type="text" id="orbPosStart" placeholder="55°45.0'N 037°37.0'E"></div>
            <div class="form-group"><label>Координаты конца</label><input type="text" id="orbPosStop" placeholder="55°46.0'N 037°38.0'E"></div>
        `,
        'D15.2': `
            <div class="row-2">
                <div class="form-group"><label>Перекачано (м³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Остаток (м³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Откуда (Bilge)</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
            <div class="form-group"><label>Куда (Sludge)</label><select id="orbDestTank" class="tank-select-sludge"></select></div>
        `,
        'E16': `
            <div class="form-group"><label>Время старта насоса</label><input type="time" id="orbStart"></div>
            <div class="form-group"><label>Координаты сброса</label><input type="text" id="orbPosStart" placeholder="55°45.0'N 037°37.0'E"></div>
            <div class="form-group"><label>Танк (Bilge)</label><select id="orbSourceTank" class="tank-select-bilge"></select></div>
        `,
        'F19': `
            <div class="row-2">
                <div class="form-group"><label>Время отказа</label><input type="time" id="orbStart"></div>
                <div class="form-group"><label>Время восстановления</label><input type="time" id="orbStop"></div>
            </div>
            <div class="form-group"><label>Причина (Reason)</label><input type="text" id="orbReason" placeholder="e.g. OCM sensor failure"></div>
        `,
        'G22': `
            <div class="form-group"><label>Время</label><input type="time" id="orbStart"></div>
            <div class="form-group"><label>Место/Координаты</label><input type="text" id="orbPosStart" placeholder="55°45.0'N 037°37.0'E"></div>
            <div class="form-group"><label>Тип и Количество (м³/л)</label><input type="text" id="orbQty" placeholder="e.g. 0.5 m³ HFO"></div>
            <div class="form-group"><label>Обстоятельства</label><input type="text" id="orbReason" placeholder="e.g. Fuel tank overflow"></div>
        `,
        'H26.3': `
            <div class="form-group"><label>Порт</label><input type="text" id="orbPort" placeholder="e.g. Rotterdam"></div>
            <div class="row-2">
                <div class="form-group"><label>Начало</label><input type="time" id="orbStart"></div>
                <div class="form-group"><label>Конец</label><input type="time" id="orbStop"></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Количество (MT)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Сера (%)</label><input type="number" id="orbSulfur" step="0.01"></div>
            </div>
            <div class="form-group"><label>Танки (Добавлено и Всего)</label><input type="text" id="orbTankDetails" placeholder="e.g. 500 MT to WO SERVICE TANK, now 600 MT"></div>
        `,
        'I_Scrubber': `
            <div class="form-group"><label>Описание (Scrubber / Прочее)</label><textarea id="orbText" placeholder="e.g. 5 m³ scrubber bleed-off water transferred to holding tank"></textarea></div>
        `
    };

    const codeSelect = document.getElementById('orbCodeSelect');
    const dynamicContainer = document.getElementById('orbDynamicFields');

    function populateTankSelects() {
        const sludgeTanks = tanks.filter(t => t.type === 'sludge');
        const bilgeTanks = tanks.filter(t => t.type === 'bilge');
        
        document.querySelectorAll('.tank-select-sludge').forEach(sel => {
            if(sludgeTanks.length === 0) sel.innerHTML = '<option value="SLUDGE TANK">SLUDGE TANK (Add in setup)</option>';
            else sel.innerHTML = sludgeTanks.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
        });
        
        document.querySelectorAll('.tank-select-bilge').forEach(sel => {
            if(bilgeTanks.length === 0) sel.innerHTML = '<option value="OILY BILGE TANK">OILY BILGE TANK (Add in setup)</option>';
            else sel.innerHTML = bilgeTanks.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
        });
    }

    function renderOrbFields() {
        dynamicContainer.innerHTML = orbFields[codeSelect.value];
        populateTankSelects();
    }
    codeSelect.onchange = renderOrbFields;

    // === ORB GENERATOR LOGIC ===
    document.getElementById('btnGenOrb').onclick = () => {
        const dateStr = formatDate(document.getElementById('chgDate').value);
        const code = codeSelect.value;
        
        let text = `Date: ${dateStr}\n`;
        let textRu = `Дата: ${dateStr}\n`;
        
        const val = (id) => document.getElementById(id) ? document.getElementById(id).value : '';

        if(code === 'C11.4') {
            text += `C 11.4\n${val('orbQty')} m³ collected from ${val('orbSourceTank')}\nRetained in ${val('orbSourceTank')}: ${val('orbRetained')} m³`;
            textRu += `C 11.4\nСобрано шлама: ${val('orbQty')} м³ из ${val('orbSourceTank')}\nОстаток в ${val('orbSourceTank')}: ${val('orbRetained')} м³`;
        } 
        else if(code === 'C12.1') {
            text += `C 12.1\n${val('orbQty')} m³ sludge from ${val('orbSourceTank')}, ${val('orbRetained')} m³ retained.\nTransferred to ${val('orbReceiver')} during port stay (${val('orbPort')})`;
            textRu += `C 12.1\nСдано шлама: ${val('orbQty')} м³ из ${val('orbSourceTank')}, остаток ${val('orbRetained')} м³.\nПередано на ${val('orbReceiver')} в порту (${val('orbPort')})`;
        }
        else if(code === 'C12.2') {
            text += `C 12.2\n${val('orbQty')} m³ sludge transferred from ${val('orbSourceTank')}, ${val('orbRetained')} m³ retained,\nto ${val('orbDestTank')}`;
            textRu += `C 12.2\nПерекачано шлама: ${val('orbQty')} м³ из ${val('orbSourceTank')}, остаток ${val('orbRetained')} м³,\nв ${val('orbDestTank')}`;
        }
        else if(code === 'C12.3') {
            text += `C 12.3\n${val('orbQty')} m³ sludge from ${val('orbSourceTank')}, ${val('orbRetained')} m³ retained,\nBurned in Incinerator for ${val('orbHours')} hours`;
            textRu += `C 12.3\nСожжено шлама: ${val('orbQty')} м³ из ${val('orbSourceTank')}, остаток ${val('orbRetained')} м³,\nВ инсинераторе в течение ${val('orbHours')} часов`;
        }
        else if(code === 'D15.1') {
            text += `D 13, 14, 15.1\n${val('orbQty')} m³ bilge water from ${val('orbSourceTank')}, capacity ${val('orbCap')} m³\nStart: ${val('orbStart')}, Stop: ${val('orbStop')}\nThrough 15 ppm equipment overboard\nPosition start: ${val('orbPosStart')}\nPosition stop: ${val('orbPosStop')}`;
            textRu += `D 13, 14, 15.1\nСброшено льяльных вод: ${val('orbQty')} м³ из ${val('orbSourceTank')}, вместимость ${val('orbCap')} м³\nНачало: ${val('orbStart')}, Конец: ${val('orbStop')}\nЧерез оборудование 15 ppm за борт\nКоординаты начала: ${val('orbPosStart')}\nКоординаты конца: ${val('orbPosStop')}`;
        }
        else if(code === 'D15.2') {
            text += `D 13, 14, 15.2\n${val('orbQty')} m³ bilge water from ${val('orbSourceTank')}, ${val('orbRetained')} m³ retained,\nto ${val('orbDestTank')}`;
            textRu += `D 13, 14, 15.2\nПерекачано льяльных вод: ${val('orbQty')} м³ из ${val('orbSourceTank')}, остаток ${val('orbRetained')} м³,\nв ${val('orbDestTank')}`;
        }
        else if(code === 'E16') {
            text += `E 16, 18\nPump start: ${val('orbStart')} at position: ${val('orbPosStart')}\nFrom: ${val('orbSourceTank')}\nStop: ${val('orbStop')}`;
            textRu += `E 16, 18\nСтарт насоса: ${val('orbStart')} в координатах: ${val('orbPosStart')}\nИз: ${val('orbSourceTank')}\nСтоп: ${val('orbStop')}`;
        }
        else if(code === 'F19') {
            text += `F 19, 20, 21\nFailure of OWS/OCM at ${val('orbStart')}. Restored at ${val('orbStop')}.\nReason: ${val('orbReason')}`;
            textRu += `F 19, 20, 21\nОтказ OWS/OCM в ${val('orbStart')}. Восстановлено в ${val('orbStop')}.\nПричина: ${val('orbReason')}`;
        }
        else if(code === 'G22') {
            text += `G 22, 23, 24, 25\nTime: ${val('orbStart')}, Position: ${val('orbPosStart')}\nType/Qty: ${val('orbQty')}\nCircumstances: ${val('orbReason')}`;
            textRu += `G 22, 23, 24, 25\nВремя: ${val('orbStart')}, Координаты: ${val('orbPosStart')}\nТип/Кол-во: ${val('orbQty')}\nОбстоятельства: ${val('orbReason')}`;
        }
        else if(code === 'H26.3') {
            text += `H 26.1, 26.2, 26.3\n${val('orbPort')}\nStart: ${val('orbStart')}, Stop: ${val('orbStop')}\n${val('orbQty')} MT of Fuel Oil (${val('orbSulfur')}% S) bunkered in tanks:\n${val('orbTankDetails')}`;
            textRu += `H 26.1, 26.2, 26.3\nПорт: ${val('orbPort')}\nНачало: ${val('orbStart')}, Конец: ${val('orbStop')}\nЗабункеровано ${val('orbQty')} МТ топлива (Сера ${val('orbSulfur')}%) в танки:\n${val('orbTankDetails')}`;
        }
        else if(code === 'I_Scrubber') {
            text += `I\n${val('orbText')}`;
            textRu += `I\n${val('orbText')}`;
        }

        document.getElementById('resOrb').innerText = text;
        document.getElementById('resOrb').style.display = 'block';
        document.getElementById('btnCopyOrb').style.display = 'block';
        document.getElementById('resOrbRu').innerText = textRu;
        document.getElementById('resOrbRu').style.display = 'block';
    };

    // === INIT ===
    renderTankList();
    renderOrbFields();

</script>
</body>
</html>
