<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EngineLog - Chief Engineer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<style>
    :root {
        --bg: #0f172a; --card: #1e293b; --border: #334155;
        --text: #e2e8f0; --text-muted: #94a3b8;
        --accent: #38bdf8; --accent-dark: #0284c7;
        --yellow: #fbbf24; --red: #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .header p { font-size: 0.7rem; color: var(--text-muted); }

    .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 8px 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #000; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 0.95rem; color: var(--yellow); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 0.9rem; }
    .form-group textarea { resize: vertical; min-height: 80px; font-family: monospace; }
    
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; }
    .btn:active { background: var(--accent-dark); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }

    .result-box { background: #020617; border: 1px solid var(--accent); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 12px; white-space: pre-wrap; color: var(--text); display: none; line-height: 1.5; }
    .copy-btn { background: var(--border); color: var(--text); margin-top: 8px; display: none; }
    
    .tank-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .tank-list-item:last-child { border-bottom: none; }
        /* ===== ФИКС ДЛЯ МОБИЛЬНЫХ ===== */
    @media (max-width: 600px) {
        .row-2 {
            grid-template-columns: 1fr !important; /* Ставим поля в одну колонку */
            gap: 10px !important;
        }
    }

    /* Фикс полей ввода, чтобы они не вылезали за края */
    input, select, textarea {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        min-width: 0 !important;
        -webkit-appearance: none;
        appearance: none;
    }

    /* Фикс высоты для Date/Time на iOS */
    input[type="date"], input[type="time"] {
        min-height: 42px;
        line-height: normal;
    }
</style>
</head>
<body>

<div class="header">
    <h1>EngineLog</h1>
    <p>MARPOL & Changeover Assistant</p>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="chg">⛽ Changeover</button>
    <button class="tab-btn" data-tab="orb">📘 ORB Gen</button>
    <button class="tab-btn" data-tab="tanks">⚙️ Tanks</button>
</div>

<!-- TAB 1: CHANGEOVER -->
<div id="tab-chg" class="tab-content">
    <div class="card">
        <h2>Fuel Changeover Record</h2>
        <div class="row-2">
            <div class="form-group"><label>Date</label><input type="date" id="chgDate"></div>
            <div class="form-group"><label>Position (Lat/Long)</label><input type="text" id="chgPos" placeholder="Lat / Long"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Type</label><select id="chgType"><option value="HFO/VLSFO to MGO/MDO">HFO/VLSFO to MGO/MDO</option><option value="MGO/MDO to HFO/VLSFO">MGO/MDO to HFO/VLSFO</option></select></div>
            <div class="form-group"><label>Sulfur Target (%)</label><input type="number" id="chgSulfur" step="0.01" value="0.10"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Start Time</label><input type="time" id="chgStart"></div>
            <div class="form-group"><label>Finish Time</label><input type="time" id="chgFinish"></div>
        </div>
        <div class="row-2">
            <div class="form-group"><label>Start Viscosity (cSt)</label><input type="number" id="chgViscStart" placeholder="e.g. 380"></div>
            <div class="form-group"><label>Finish Viscosity (cSt)</label><input type="number" id="chgViscEnd" placeholder="e.g. 12"></div>
        </div>
        <button class="btn" id="btnGenChg">Generate Text</button>
        <div class="result-box" id="resChg"></div>
        <button class="btn copy-btn" id="btnCopyChg">📋 Copy Text</button>
    </div>
</div>

<!-- TAB 2: ORB GENERATOR -->
<div id="tab-orb" class="tab-content" style="display:none;">
    <div class="card">
        <h2>ORB Entry Generator</h2>
        
        <div class="form-group">
            <label>Select Operation Code</label>
            <select id="orbCodeSelect">
                <option value="C11.4">C 11.4 - Collection of Sludge (from source)</option>
                <option value="C12.1">C 12.1 - Disposal of Sludge to Shore</option>
                <option value="C12.2">C 12.2 - Transfer Sludge to another tank</option>
                <option value="C12.3">C 12.3 - Incineration of Sludge</option>
                <option value="D15.1">D 15.1 - Discharge Bilge Water Overboard (15 ppm)</option>
                <option value="D15.2">D 15.2 - Transfer Bilge Water to tank</option>
                <option value="H26.3">H 26.3 - Bunkering of Fuel Oil</option>
                <option value="I">I - Additional operational procedures (Scrubber)</option>
            </select>
        </div>

        <!-- Dynamic Fields Container -->
        <div id="orbDynamicFields"></div>

        <button class="btn" id="btnGenOrb">Generate ORB Entry</button>
        <div class="result-box" id="resOrb"></div>
        <button class="btn copy-btn" id="btnCopyOrb">📋 Copy Text</button>
    </div>
</div>

<!-- TAB 3: TANKS SETUP -->
<div id="tab-tanks" class="tab-content" style="display:none;">
    <div class="card">
        <h2>Vessel Tanks Setup</h2>
        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:12px;">Enter tank names exactly as per IOPPC Supplement.</p>
        
        <div class="form-group">
            <label>Sludge Tank (Sec 3.1)</label>
            <input type="text" id="tankSludge" placeholder="e.g. SLUDGE TANK (PORT)">
        </div>
        <div class="form-group">
            <label>Bilge Holding Tank (Sec 3.3)</label>
            <input type="text" id="tankBilge" placeholder="e.g. OILY BILGE TANK (STBD)">
        </div>
        <div class="form-group">
            <label>Service Tank (Fuel)</label>
            <input type="text" id="tankService" placeholder="e.g. WO SERVICE TANK (P)">
        </div>
        <div class="form-group">
            <label>Settling Tank (Fuel)</label>
            <input type="text" id="tankSettling" placeholder="e.g. WO SETTLING TANK (S)">
        </div>

        <button class="btn" id="btnSaveTanks">Save Tanks</button>
    </div>
</div>

<script>
    // === TABS LOGIC ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
        };
    });

    // === DATE FORMATTER (dd-MMM-yyyy) ===
    function formatDate(dateStr) {
        if(!dateStr) return '';
        const d = new Date(dateStr);
        const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const day = String(d.getDate()).padStart(2, '0');
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
    }

    // === COPY FUNCTION ===
    function setupCopy(btnId, boxId) {
        document.getElementById(btnId).onclick = function() {
            const text = document.getElementById(boxId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                this.textContent = '✅ Copied!';
                setTimeout(() => { this.textContent = '📋 Copy Text'; }, 2000);
            });
        };
    }
    setupCopy('btnCopyChg', 'resChg');
    setupCopy('btnCopyOrb', 'resOrb');

    // === TANKS SETUP ===
    const tanks = {
        sludge: localStorage.getItem('tank_sludge') || 'SLUDGE TANK',
        bilge: localStorage.getItem('tank_bilge') || 'OILY BILGE TANK',
        service: localStorage.getItem('tank_service') || 'WO SERVICE TANK',
        settling: localStorage.getItem('tank_settling') || 'WO SETTLING TANK'
    };

    document.getElementById('tankSludge').value = tanks.sludge;
    document.getElementById('tankBilge').value = tanks.bilge;
    document.getElementById('tankService').value = tanks.service;
    document.getElementById('tankSettling').value = tanks.settling;

    document.getElementById('btnSaveTanks').onclick = () => {
        localStorage.setItem('tank_sludge', document.getElementById('tankSludge').value);
        localStorage.setItem('tank_bilge', document.getElementById('tankBilge').value);
        localStorage.setItem('tank_service', document.getElementById('tankService').value);
        localStorage.setItem('tank_settling', document.getElementById('tankSettling').value);
        alert('Tanks saved!');
    };

    // === CHANGEOVER GENERATOR ===
    document.getElementById('chgDate').valueAsDate = new Date();
    document.getElementById('btnGenChg').onclick = () => {
        const date = formatDate(document.getElementById('chgDate').value);
        const pos = document.getElementById('chgPos').value || 'N/A';
        const type = document.getElementById('chgType').value;
        const sulfur = document.getElementById('chgSulfur').value;
        const start = document.getElementById('chgStart').value;
        const finish = document.getElementById('chgFinish').value;
        const vStart = document.getElementById('chgViscStart').value || 'N/A';
        const vEnd = document.getElementById('chgViscEnd').value || 'N/A';

        if(!start || !finish) { alert('Enter Start and Finish times.'); return; }

        let text = `${date} at Position: ${pos}\n`;
        text += `Commenced fuel oil changeover from ${type.split(' to ')[0]} to ${type.split(' to ')[1]}.\n`;
        text += `Start Time: ${start}. Initial Viscosity: ${vStart} cSt.\n`;
        text += `Completed fuel oil changeover at ${finish}.\n`;
        text += `Final Viscosity: ${vEnd} cSt. Sulfur content: max ${sulfur}% m/m.\n`;
        text += `Changeover procedure performed in accordance with vessel's approved changeover plan.`;

        document.getElementById('resChg').innerText = text;
        document.getElementById('resChg').style.display = 'block';
        document.getElementById('btnCopyChg').style.display = 'block';
    };

    // === ORB DYNAMIC FIELDS ===
    const orbFields = {
        'C11.4': `
            <div class="row-2">
                <div class="form-group"><label>Quantity collected (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Source of sludge</label><input type="text" id="orbSource" placeholder="e.g. FO Separator drain" value="FO Separator"></div>
            </div>
            <div class="form-group"><label>Quantity retained in tank (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
        `,
        'C12.1': `
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Receiver (Barge/Truck)</label><input type="text" id="orbReceiver" placeholder="e.g. Barge 'Eco-Service'"></div>
            <div class="form-group"><label>Port Name</label><input type="text" id="orbPort" placeholder="e.g. Singapore"></div>
        `,
        'C12.2': `
            <div class="row-2">
                <div class="form-group"><label>Quantity transferred (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained in source (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Destination Tank</label><input type="text" id="orbDest" placeholder="e.g. SLUDGE TANK 2"></div>
        `,
        'C12.3': `
            <div class="row-2">
                <div class="form-group"><label>Quantity incinerated (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Duration (hours)</label><input type="number" id="orbHours" step="0.1"></div>
        `,
        'D15.1': `
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Capacity of tank (m³)</label><input type="number" id="orbCap" step="0.01"></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Start Time</label><input type="time" id="orbStart"></div>
                <div class="form-group"><label>Stop Time</label><input type="time" id="orbStop"></div>
            </div>
            <div class="form-group"><label>Start Position (Lat/Long)</label><input type="text" id="orbPosStart" placeholder="55°45.0'N 037°37.0'E"></div>
            <div class="form-group"><label>Stop Position (Lat/Long)</label><input type="text" id="orbPosStop" placeholder="55°46.0'N 037°38.0'E"></div>
        `,
        'D15.2': `
            <div class="row-2">
                <div class="form-group"><label>Quantity (m³)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Quantity retained (m³)</label><input type="number" id="orbRetained" step="0.01"></div>
            </div>
            <div class="form-group"><label>Destination Tank</label><input type="text" id="orbDest" placeholder="e.g. SLUDGE TANK"></div>
        `,
        'H26.3': `
            <div class="form-group"><label>Port Name</label><input type="text" id="orbPort" placeholder="e.g. Rotterdam"></div>
            <div class="row-2">
                <div class="form-group"><label>Start Time</label><input type="time" id="orbStart"></div>
                <div class="form-group"><label>Stop Time</label><input type="time" id="orbStop"></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Total Quantity (MT)</label><input type="number" id="orbQty" step="0.01"></div>
                <div class="form-group"><label>Sulfur Content (%)</label><input type="number" id="orbSulfur" step="0.01"></div>
            </div>
            <div class="form-group"><label>Tank Details (Added & Total)</label><input type="text" id="orbTankDetails" placeholder="e.g. 500 MT to WO SERVICE TANK, now 600 MT"></div>
        `,
        'I': `
            <div class="form-group"><label>Remarks (e.g. Scrubber operation)</label><textarea id="orbText" placeholder="e.g. 5 m³ scrubber bleed-off water transferred to holding tank"></textarea></div>
        `
    };

    const codeSelect = document.getElementById('orbCodeSelect');
    const dynamicContainer = document.getElementById('orbDynamicFields');

    function renderOrbFields() {
        dynamicContainer.innerHTML = orbFields[codeSelect.value];
    }
    codeSelect.onchange = renderOrbFields;
    renderOrbFields(); // Initial load

    // === ORB GENERATOR LOGIC ===
    document.getElementById('btnGenOrb').onclick = () => {
        const dateStr = formatDate(document.getElementById('chgDate').value); // Reuse date from changeover tab if needed, but better ask for it
        const code = codeSelect.value;
        let text = `Date: ${dateStr}\n`;
        
        // Get values safely
        const val = (id) => document.getElementById(id) ? document.getElementById(id).value : '';

        if(code === 'C11.4') {
            text += `C 11.4\n`;
            text += `${val('orbQty')} m³ collected from ${val('orbSource')}\n`;
            text += `Retained in ${tanks.sludge}: ${val('orbRetained')} m³`;
        } 
        else if(code === 'C12.1') {
            text += `C 12.1\n`;
            text += `${val('orbQty')} m³ sludge from ${tanks.sludge}, ${val('orbRetained')} m³ retained.\n`;
            text += `Transferred to ${val('orbReceiver')} during port stay (${val('orbPort')})`;
        }
        else if(code === 'C12.2') {
            text += `C 12.2\n`;
            text += `${val('orbQty')} m³ sludge transferred from ${tanks.sludge}, ${val('orbRetained')} m³ retained,\n`;
            text += `to ${val('orbDest')}`;
        }
        else if(code === 'C12.3') {
            text += `C 12.3\n`;
            text += `${val('orbQty')} m³ sludge from ${tanks.sludge}, ${val('orbRetained')} m³ retained,\n`;
            text += `Burned in Incinerator for ${val('orbHours')} hours`;
        }
        else if(code === 'D15.1') {
            text += `D 13, 14, 15.1\n`;
            text += `${val('orbQty')} m³ bilge water from ${tanks.bilge}, capacity ${val('orbCap')} m³\n`;
            text += `Start: ${val('orbStart')}, Stop: ${val('orbStop')}\n`;
            text += `Through 15 ppm equipment overboard\n`;
            text += `Position start: ${val('orbPosStart')}\n`;
            text += `Position stop: ${val('orbPosStop')}`;
        }
        else if(code === 'D15.2') {
            text += `D 13, 14, 15.2\n`;
            text += `${val('orbQty')} m³ bilge water from ${tanks.bilge}, ${val('orbRetained')} m³ retained,\n`;
            text += `to ${val('orbDest')}`;
        }
        else if(code === 'H26.3') {
            text += `H 26.1, 26.2, 26.3\n`;
            text += `${val('orbPort')}\n`;
            text += `Start: ${val('orbStart')}, Stop: ${val('orbStop')}\n`;
            text += `${val('orbQty')} MT of Fuel Oil (${val('orbSulfur')}% S) bunkered in tanks:\n`;
            text += `${val('orbTankDetails')}`;
        }
        else if(code === 'I') {
            text += `I\n`;
            text += `${val('orbText')}`;
        }

        document.getElementById('resOrb').innerText = text;
        document.getElementById('resOrb').style.display = 'block';
        document.getElementById('btnCopyOrb').style.display = 'block';
    };
</script>
</body>
</html>
